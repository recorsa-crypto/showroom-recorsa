function crearSlugURL(texto) {
if (!texto) return '';
return texto.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '-').replace(/[^\w\-]+/g, '').replace(/\-\-+/g, '-').replace(/^-+/, '').replace(/-+$/, '');
}
function checkUrlParams() {
var params = new URLSearchParams(window.location.search);
if (params.has('panel') || params.get('admin') === '1') { state.view = 'admin-login'; return; }
var codigoParam = params.get('codigo'), catParam = params.get('cat'), secParam = params.get('sec'), prodParam = params.get('prod');
if (codigoParam) {
var found = false;
for (var i = 0; i < appData.sections.length; i++) {
var s = appData.sections[i];
var p = s.products.find(x => crearSlugURL(x.code) === codigoParam);
if (p) { state.view = 'product'; state.currentSection = s.id; state.currentProduct = p.id; found = true; break; }
}
if (!found) state.view = 'home';
} else if (catParam) {
var s = appData.sections.find(x => crearSlugURL(x.name) === catParam);
if (s) { state.view = 'section'; state.currentSection = s.id; state.currentProduct = null; } else { state.view = 'home'; }
} else if (secParam && prodParam) {
state.view = 'product'; state.currentSection = secParam; state.currentProduct = prodParam;
} else if (secParam) {
state.view = 'section'; state.currentSection = secParam; state.currentProduct = null;
} else {
if (state.view !== 'admin' && state.view !== 'admin-login') { state.view = 'home'; state.currentSection = null; state.currentProduct = null; }
}
}

var p = s ? s.products.find(x => x.id === state.currentProduct) : null;
if (p && p.code) newUrl += '?codigo=' + crearSlugURL(p.code);
}
if (newUrl !== window.location.pathname + window.location.search) {
window.history.pushState({}, '', newUrl);
}
}

async function loadStatsData() {
var tk = sessionStorage.getItem('rc_token') || '';
try {
const res = await fetch(API_URL + '?action=stats', { cache: 'no-store', headers: tk ? { 'X-Auth-Token': tk } : {} });
if (res.status === 401) { state.stats = null; }
else if (res.ok) state.stats = await res.json();
} catch (e) { state.stats = state.stats || null; }
if (state.view === 'admin' && state.adminTab === 'dashboard') render();
}
async function resetStatsServer() {
if (!confirm('⚠️ ¿Borrar TODAS las estadísticas de visitas y conversión? Esta acción no se puede deshacer.')) return;
try {
await fetch(API_URL + '?action=stats_reset', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, tkHeader()), body: '{}' });
} catch (e) {}
state.stats = null;
await loadStatsData();
}
function monthLabel(key) {
if (!key) return '';
var names = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var parts = String(key).split('-');
var mo = parseInt(parts[1], 10);
return names[mo - 1] + ' ' + parts[0];
}
function bucketSafe(x) {
x = x || {};
return {
total: x.total || 0,
conv: x.conv || { cta: 0, cart: 0, checkout: 0 },
sections: x.sections || {},
products: x.products || {},
campaigns: x.campaigns || {}
};
}

var u = document.getElementById('loginUser').value, p = document.getElementById('loginPass').value, err = document.getElementById('loginError');
try {
const res = await fetch(API_URL + '?action=login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: u, password: p }) });
const out = await res.json().catch(() => ({}));
if (res.ok && out.token) {
sessionStorage.setItem('rc_token', out.token);
setAdminSilent();
state.view = 'admin';
state.stats = null;
state.leads = null;
await loadData();
} else {
err.textContent = '⛔ BARRERA DE SEGURIDAD: Credenciales Denegadas'; err.classList.remove('hidden');
}
} catch (e2) {
err.textContent = '⛔ Error de conexión con el servidor'; err.classList.remove('hidden');
}
});
}
var configForm = document.getElementById('configForm');
if (configForm) {
configForm.addEventListener('submit', async function(e) {
e.preventDefault();
var fd = new FormData(configForm); for (var pair of fd.entries()) appData.config[pair[0]] = pair[1];
const ok = await saveData(); if (ok) { alert('✅ Base de datos de Sistema Core Actualizada Exitosamente'); render(); }
});
}
var locationForm = document.getElementById('locationForm');
if (locationForm) {
var latInput = locationForm.querySelector('[name="latitude"]'), lngInput = locationForm.querySelector('[name="longitude"]'), mapPreview = document.getElementById('adminMapPreview');
function updateMapPreview() { var lat = parseFloat(latInput.value), lng = parseFloat(lngInput.value); if (!isNaN(lat) && !isNaN(lng) && mapPreview) mapPreview.src = buildMapUrl(lat, lng); }
if (latInput && lngInput) { latInput.addEventListener('input', updateMapPreview); lngInput.addEventListener('input', updateMapPreview); }
locationForm.addEventListener('submit', async function(e) {
e.preventDefault();
var lat = parseFloat(new FormData(locationForm).get('latitude')), lng = parseFloat(new FormData(locationForm).get('longitude'));
if (isNaN(lat) || isNaN(lng)) return alert('Coordenadas inválidas detectadas en núcleo GPS');
appData.config.latitude = lat; appData.config.longitude = lng;
const ok = await saveData(); if (ok) { alert('✅ Vectores Geográficos Sincronizados al Servidor'); render(); }
});
}
var credForm = document.getElementById('credForm');
if (credForm) {
credForm.addEventListener('submit', async function(e) {
e.preventDefault();
appData.credentials.username = new FormData(credForm).get('username'); appData.credentials.password = new FormData(credForm).get('password');
const ok = await saveData(); if (ok) alert('🔐 Cambio de Llave Root Efectivo. Usa tu nueva contraseña en la próxima sesión.');
});
}
var contactForm = document.getElementById('contactForm');
if (contactForm) {
contactForm.addEventListener('submit', async function(e) {
e.preventDefault();
var fd = new FormData(contactForm);
appData.config.email = fd.get('email') || '';
appData.config.phone = fd.get('phone') || '';
appData.config.website = fd.get('website') || '';
appData.config.address = fd.get('address') || '';
const ok = await saveData();
if (ok) { alert('✅ Información de contacto actualizada'); render(); }
});
}
}
loadData();
</script>
</body>
</html>
